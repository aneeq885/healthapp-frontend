name: Deploy Frontend to EC2

on:
  push:
    branches: [ main ]

jobs:

  # =========================
  # JOB 1: BUILD & PUSH
  # =========================
  docker-build-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build Docker Image
        run: |
          docker build -t aneeq885/healthapp-frontend:latest .

      - name: Push Docker Image
        run: |
          docker push aneeq885/healthapp-frontend:latest


  # =========================
  # JOB 2: DEPLOY TO EC2
  # =========================
  deploy-to-ec2:
    needs: docker-build-push
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to EC2 via SSH
        uses: appleboy/ssh-action@v0.1.10
        with:
          host: 13.48.156.60
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            docker pull aneeq885/healthapp-frontend:latest

            docker stop healthapp-frontend || true
            docker rm healthapp-frontend || true

            docker run -d \
              --name healthapp-frontend \
              --network healthapp-net \
              -p 3001:3000 \
              --restart always \
              aneeq885/healthapp-frontend:latest